<text class="t1" x="598.0" y="338.0" font-size="13" font-weight="400">64.52 ms<tspan class="t3" font-weight="400" dx="6">8.9× Yalın</tspan></text>
<text class="t3" x="24" y="396" font-size="11">Tree APIs of each library, then navigation. AndroidX Microbenchmark, release build.</text>
