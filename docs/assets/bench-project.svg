<text class="t1" x="432.3" y="224.0" font-size="13" font-weight="400">41.78 ms<tspan class="t3" font-weight="400" dx="6">5.7× Yalın</tspan></text>
<text class="t2" x="106" y="262.0" font-size="14" font-weight="400" text-anchor="end">Gson</text>
<path class="lo" d="M120,244 h323.1 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-323.1 z"/>
<text class="t1" x="455.1" y="262.0" font-size="13" font-weight="400">44.90 ms<tspan class="t3" font-weight="400" dx="6">6.2× Yalın</tspan></text>
<text class="t2" x="106" y="300.0" font-size="14" font-weight="400" text-anchor="end">kotlinx</text>
