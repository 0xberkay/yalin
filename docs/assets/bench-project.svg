<text class="t1" x="493.7" y="300.0" font-size="13" font-weight="400">50.20 ms<tspan class="t3" font-weight="400" dx="6">6.9× Yalın</tspan></text>
<text class="t2" x="106" y="338.0" font-size="14" font-weight="400" text-anchor="end">Moshi</text>
