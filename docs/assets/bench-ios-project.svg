<text class="t1" x="529.0" y="150" font-size="13" font-weight="650">15.74 ms</text>
<text class="t3" x="24" y="206" font-size="11">Foundation builds a tree, then reads the same four fields.</text>
<text class="t3" x="612" y="206" font-size="11" text-anchor="end">Median time in ms</text>
