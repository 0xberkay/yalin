<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="title description">
<title id="title">Read 4 fields from a 1 MB JSON</title>
<desc id="description">iOS 26.2 simulator (iPhone 17 Pro) on Apple M3 · Optimized build. Yalın project 2.23 ms, JSONSerialization 15.74 ms.</desc>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#66645e}
