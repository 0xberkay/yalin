  }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="760" height="220" rx="12"/>
<text class="t1" x="24" y="38" font-size="19" font-weight="650">Read 4 fields from a 1 MB JSON</text>
<text class="t2" x="24" y="62" font-size="13">iOS 26.2 simulator (iPhone 17 Pro) on Apple M3 · Optimized build</text>
<line class="grid" x1="180" x2="180" y1="83" y2="169"/>
<text class="t3" x="180" y="185" font-size="11" text-anchor="middle">0</text>
<line class="grid" x1="288" x2="288" y1="83" y2="169"/>
<text class="t3" x="288" y="185" font-size="11" text-anchor="middle">5</text>
<line class="grid" x1="396" x2="396" y1="83" y2="169"/>
<text class="t3" x="396" y="185" font-size="11" text-anchor="middle">10</text>
<line class="grid" x1="504" x2="504" y1="83" y2="169"/>
<text class="t3" x="504" y="185" font-size="11" text-anchor="middle">15</text>
<line class="grid" x1="612" x2="612" y1="83" y2="169"/>
<text class="t3" x="612" y="185" font-size="11" text-anchor="middle">20</text>
