[workspace]
resolver = "3"
members = ["crates/yalin-core", "crates/yalin-jni", "crates/yalin-bench"]

[workspace.package]
edition = "2024"
version = "0.0.2"
license = "Apache-2.0"

# Shipping profile for libyalin.so. Keep panic = "unwind": the JNI layer
# catches panics at the boundary instead of aborting the app.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Release codegen with symbols, for on-device benchmarks and simpleperf.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
