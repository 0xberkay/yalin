[package]
name = "yalin-jni"
description = "JNI boundary for Yalın (builds libyalin.so)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "yalin"
# rlib: lets yalin-bench time the tree encoder without a JVM.
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22.4"
yalin-core = { path = "../yalin-core" }
